name: codeql

# Replaces GitHub's "default setup" for code scanning. Default setup can only autobuild, which runs a bare
# `./gradlew assemble` on a clean runner. This project needs Android platform 37, build-tools 36.0.0 and the
# pinned NDK installed first (see build.yml), so autobuild always failed. Here java-kotlin is built manually
# after the same SDK setup. Default setup must be switched off in the repository settings, because GitHub
# rejects uploads from an advanced workflow while it is enabled.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    # Same job name as default setup, so branch-protection rules that reference it keep matching.
    name: Analyze (${{ matrix.language }})
    # Pinned, not ubuntu-latest: the Android SDK setup below is validated against this image (as in build.yml).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Kotlin can only be extracted from a real build; `none` would silently analyze Java only.
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        if: matrix.language == 'java-kotlin'

      - name: Set up the Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ""

      - name: Resolve pinned NDK version
        if: matrix.language == 'java-kotlin'
        id: ndk
        run: echo "version=$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)" >> "$GITHUB_OUTPUT"

      - name: Cache NDK
        if: matrix.language == 'java-kotlin'
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ steps.ndk.outputs.version }}
          key: ndk-${{ runner.os }}-${{ steps.ndk.outputs.version }}

      - name: Install SDK packages
        if: matrix.language == 'java-kotlin'
        run: |
          # android-37 lives in Google's newer index; it is preinstalled, so its install failure is harmless.
          android sdk install platform-tools platforms/android-37 build-tools/36.0.0
          android sdk install "ndk/${{ steps.ndk.outputs.version }}"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # CodeQL records the compiler invocations of this build, so nothing may be served from a cache:
      # --no-build-cache stops compile tasks from being skipped, and in-process Kotlin compilation keeps the
      # compiler inside the traced Gradle JVM instead of a separate Kotlin daemon the tracer cannot see. A
      # single JVM now does the work of two, hence the larger heap than gradle.properties sets.
      # assembleDebug compiles every main source set; release adds R8, shrinking and symbol stripping that
      # contribute nothing to the analysis.
      - name: Build for analysis
        if: matrix.language == 'java-kotlin'
        run: |
          ./gradlew --no-daemon --no-build-cache \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs="-Xmx6g -Dfile.encoding=UTF-8" \
            assembleDebug

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
