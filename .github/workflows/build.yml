name: build

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Test and build
    # Tag pushes get the release job instead, which re-runs the same build.
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          yes | sdkmanager --licenses > /dev/null || true

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble release
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: papyrus-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    # `always()` is load-bearing. A tag push skips `ci` (its `if` is branch-only), and a
    # skipped job skips everything that `needs` it -- so without this the release would
    # never publish. The release job runs the unit tests itself, so gating on `ci` buys
    # nothing anyway; this ordering just keeps the tag build behind the branch build.
    if: always() && github.ref_type == 'tag'
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 is load-bearing, not hygiene. The versionCode assert below compares
      # this build against the previous release tag, and the default shallow fetch hands the
      # runner neither the other tags nor the file contents of the previous release: `git tag`
      # comes back empty and there is nothing to compare against. The ci job above needs no
      # history and deliberately keeps the default shallow fetch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          yes | sdkmanager --licenses > /dev/null || true

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # The release key lives in repository secrets, never in the repo: a keystore that
      # is committed is a compromised key, and one that only exists on a runner is
      # regenerated per run, so no two releases share a signing identity and users cannot
      # upgrade-install over each other. Secrets are string-only, so the keystore travels
      # base64-encoded in PAPYRUS_KEYSTORE_BASE64 and is decoded back to a binary file
      # here. See README "Releases" for the one-time setup.
      - name: Check signing secrets are present
        env:
          KEYSTORE_B64: ${{ secrets.PAPYRUS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PAPYRUS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PAPYRUS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PAPYRUS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${KEYSTORE_B64:-}" ]   || missing+=(PAPYRUS_KEYSTORE_BASE64)
          [ -n "${STORE_PASSWORD:-}" ] || missing+=(PAPYRUS_STORE_PASSWORD)
          [ -n "${KEY_ALIAS:-}" ]      || missing+=(PAPYRUS_KEY_ALIAS)
          [ -n "${KEY_PASSWORD:-}" ]   || missing+=(PAPYRUS_KEY_PASSWORD)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing repository secret(s): ${missing[*]}"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "Without these the release cannot be signed, so this stops here rather"
            echo "than publishing an APK no one can upgrade to."
            exit 1
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.PAPYRUS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/papyrus-release.jks"
          test -s "$RUNNER_TEMP/papyrus-release.jks"

      - name: Assemble signed release
        env:
          PAPYRUS_STORE_FILE: ${{ runner.temp }}/papyrus-release.jks
          PAPYRUS_STORE_PASSWORD: ${{ secrets.PAPYRUS_STORE_PASSWORD }}
          PAPYRUS_KEY_ALIAS: ${{ secrets.PAPYRUS_KEY_ALIAS }}
          PAPYRUS_KEY_PASSWORD: ${{ secrets.PAPYRUS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signatures
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          count=0
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "::group::$apk"
            # Also fails on an unsigned APK, so a build that silently lost its signing
            # config is caught here rather than shipped.
            "$build_tools/apksigner" verify --print-certs --verbose "$apk"
            echo "::endgroup::"
            # Belt and braces: a signed APK is not automatically a *release*-signed one.
            # The debug key would satisfy apksigner while producing an artifact that can
            # never be replaced by a properly signed build.
            if "$build_tools/apksigner" verify --print-certs "$apk" \
              | grep -q 'CN=Android Debug'; then
              echo "::error::$apk is signed with the Android debug certificate"
              exit 1
            fi
            count=$((count + 1))
          done
          echo "Verified $count signed APK(s)"
          test "$count" -eq 1

      - name: Assert the tag matches versionName
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          actual=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "tag=$tag versionName=$actual"
          if [ "$tag" != "$actual" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $actual in app/build.gradle.kts"
            exit 1
          fi

      # The versionName assert above cannot catch a forgotten versionCode bump: a tag bumped
      # to 0.4 while versionCode stays at 2 passes that check cleanly. versionCode is the only
      # value the Android package manager uses to order releases, so a repeat is not a
      # cosmetic slip -- the OS can never distinguish the new build from the one it is
      # replacing, and Play Store rejects the upload outright. Compared against the previous
      # release tag rather than a hardcoded number so this never needs editing as we version on.
      - name: Assert versionCode increased
        run: |
          set -euo pipefail
          current=$(grep -om1 -P 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          # Picked with a read loop rather than `git tag | grep | head -1`: a head-terminated
          # pipeline can hand its writer a SIGPIPE, which `pipefail` then reports as exit 141.
          # Measured to need the tag list to outgrow the pipe buffer -- roughly 20k tags, so it
          # is not reachable here today, and this only keeps a sharp edge out of the step that
          # decides whether a release ships. A first-ever release has no earlier tag to compare
          # against, which is a skip rather than a failure.
          previous_tag=""
          while read -r candidate; do
            if [ "$candidate" != "$GITHUB_REF_NAME" ]; then
              previous_tag="$candidate"
              break
            fi
          done < <(git tag --list 'v*' --sort=-v:refname)
          if [ -z "$previous_tag" ]; then
            echo "No earlier v* tag to compare against; skipping the versionCode check."
            exit 0
          fi
          previous=$(git show "$previous_tag:app/build.gradle.kts" \
            | grep -om1 -P 'versionCode\s*=\s*\K\d+' || true)
          echo "tag=$GITHUB_REF_NAME versionCode=$current previous=$previous_tag:$previous"
          if [ -z "$current" ] || [ -z "$previous" ]; then
            echo "::error::Could not read a versionCode from this build or from $previous_tag."
            exit 1
          fi
          if [ "$current" -le "$previous" ]; then
            echo "::error::versionCode $current must be greater than $previous (from $previous_tag)."
            echo "Android orders releases by versionCode alone, so an unchanged value ships an"
            echo "artifact the OS cannot tell apart from the release it is replacing."
            exit 1
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: Papyrus ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
