name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Test and build
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ""

      - name: Resolve pinned NDK version
        id: ndk
        run: echo "version=$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)" >> "$GITHUB_OUTPUT"

      - name: Cache NDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ steps.ndk.outputs.version }}
          key: ndk-${{ runner.os }}-${{ steps.ndk.outputs.version }}

      - name: Install SDK packages
        run: |
          # android-37 lives in Google's newer index; it is preinstalled, so its install failure is harmless.
          android sdk install platform-tools platforms/android-37 build-tools/36.0.0
          android sdk install "ndk/${{ steps.ndk.outputs.version }}"

      - name: Check
        run: ./gradlew --no-daemon check

      - name: Assemble release
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: papyrus-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/reports/detekt/
          if-no-files-found: ignore

  instrumentation-tests:
    # Keep this job id: setup-gradle's cache key includes it, so renaming orphans the remote cache.
    name: Emulator tests
    # Pushes to main only: a pull request gets the unit tests and the build, not the costly emulator run.
    if: github.ref_type == 'branch' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The build fails when LESS than this share of the emulator suite passed.
      EMULATOR_MIN_PASS_PERCENT: "90"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ""

      - name: Resolve pinned NDK version
        id: ndk
        run: echo "version=$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)" >> "$GITHUB_OUTPUT"

      - name: Cache NDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ steps.ndk.outputs.version }}
          key: ndk-${{ runner.os }}-${{ steps.ndk.outputs.version }}

      - name: Align preinstalled command-line tools
        # Runner's cmdline-tools/latest predates SDK XML v4; point it at the copy setup-android installed.
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/cmdline-tools"
          active="$(dirname "$(dirname "$(command -v sdkmanager)")")"
          if [ "$active" != "$tools/latest" ]; then
            rm -rf "$tools/latest"
            ln -s "$active" "$tools/latest"
          fi

      - name: Install SDK packages
        run: |
          android sdk install platform-tools platforms/android-37 build-tools/36.0.0
          android sdk install "ndk/${{ steps.ndk.outputs.version }}"
          android sdk install "system-images;android-34;google_apis;x86_64"
          android sdk install emulator

      - name: Enable KVM
        # Runner exposes /dev/kvm without group permissions; otherwise the emulator falls back to software.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Built before the emulator step: compiling there starves the freshly booted emulator's launcher, and its ANR
      # dialog then owns input focus so no test can find the app.
      - name: Build debug and test APKs
        run: ./gradlew --no-daemon packageDebug packageDebugAndroidTest

      - name: Run emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Instrumented tests must run against debug: R8 strips the release classpath (android/android-test#2167).
          script: bash .github/scripts/run-emulator-tests.sh

      - name: Check emulator test results
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/evaluate-emulator-tests.py --min-pass-percent "$EMULATOR_MIN_PASS_PERCENT"

      # The soft gate would tolerate a failing golden; this class must be green in full.
      - name: Grade raster goldens strictly
        if: ${{ !cancelled() }}
        run: |
          python3 .github/scripts/evaluate-emulator-tests.py \
            --min-pass-percent 0 \
            --require-class io.github.pixelrick420.papyrus.viewer.pptx.render.GoldenImageTest

      - name: Upload emulator test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-test-results
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/emulator-ci/
          if-no-files-found: ignore

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # fetch-depth: 0: the ancestry and versionCode checks need origin/main and the tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # HEAD, not GITHUB_SHA: an annotated tag's SHA is the tag object, not a branch commit.
      - name: Assert the tag is on main
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main; refusing to publish it."
            echo "A commit that never reached main has run neither the unit tests nor the emulator suite."
            echo "Merge it to main first, then move the tag onto the merged commit."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on main at $(git rev-parse --short HEAD)"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ""

      - name: Resolve pinned NDK version
        id: ndk
        run: echo "version=$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)" >> "$GITHUB_OUTPUT"

      - name: Cache NDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ steps.ndk.outputs.version }}
          key: ndk-${{ runner.os }}-${{ steps.ndk.outputs.version }}

      - name: Install SDK packages
        run: |
          # android-37 lives in Google's newer index; it is preinstalled, so its install failure is harmless.
          android sdk install platform-tools platforms/android-37 build-tools/36.0.0
          android sdk install "ndk/${{ steps.ndk.outputs.version }}"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # A committed keystore is a compromised key; secrets are string-only, so it travels base64-encoded.
      - name: Check signing secrets are present
        env:
          KEYSTORE_B64: ${{ secrets.PAPYRUS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PAPYRUS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PAPYRUS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PAPYRUS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${KEYSTORE_B64:-}" ]   || missing+=(PAPYRUS_KEYSTORE_BASE64)
          [ -n "${STORE_PASSWORD:-}" ] || missing+=(PAPYRUS_STORE_PASSWORD)
          [ -n "${KEY_ALIAS:-}" ]      || missing+=(PAPYRUS_KEY_ALIAS)
          [ -n "${KEY_PASSWORD:-}" ]   || missing+=(PAPYRUS_KEY_PASSWORD)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing repository secret(s): ${missing[*]}"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "Without these the release cannot be signed, so this stops here rather"
            echo "than publishing an APK no one can upgrade to."
            exit 1
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.PAPYRUS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/papyrus-release.jks"
          test -s "$RUNNER_TEMP/papyrus-release.jks"

      - name: Assemble signed release
        env:
          PAPYRUS_STORE_FILE: ${{ runner.temp }}/papyrus-release.jks
          PAPYRUS_STORE_PASSWORD: ${{ secrets.PAPYRUS_STORE_PASSWORD }}
          PAPYRUS_KEY_ALIAS: ${{ secrets.PAPYRUS_KEY_ALIAS }}
          PAPYRUS_KEY_PASSWORD: ${{ secrets.PAPYRUS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signatures
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          count=0
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "::group::$apk"
            # Fails on an unsigned APK, catching a build that silently lost its signing config.
            "$build_tools/apksigner" verify --print-certs --verbose "$apk"
            echo "::endgroup::"
            # The debug key satisfies apksigner but cannot be replaced by a properly signed build.
            if "$build_tools/apksigner" verify --print-certs "$apk" \
              | grep -q 'CN=Android Debug'; then
              echo "::error::$apk is signed with the Android debug certificate"
              exit 1
            fi
            count=$((count + 1))
          done
          echo "Verified $count signed APK(s)"
          test "$count" -eq 3

      - name: Assert the tag matches versionName
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          actual=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "tag=$tag versionName=$actual"
          if [ "$tag" != "$actual" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $actual in app/build.gradle.kts"
            exit 1
          fi

      # versionCode is the only value releases are ordered by, so a repeat ships an indistinguishable artifact.
      - name: Assert versionCode increased
        run: |
          set -euo pipefail
          current=$(grep -om1 -P 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          # A read loop, not `git tag | grep | head -1`: SIGPIPE would exit 141 under pipefail.
          previous_tag=""
          while read -r candidate; do
            if [ "$candidate" != "$GITHUB_REF_NAME" ]; then
              previous_tag="$candidate"
              break
            fi
          done < <(git tag --list 'v*' --sort=-v:refname)
          if [ -z "$previous_tag" ]; then
            echo "No earlier v* tag to compare against; skipping the versionCode check."
            exit 0
          fi
          previous=$(git show "$previous_tag:app/build.gradle.kts" \
            | grep -om1 -P 'versionCode\s*=\s*\K\d+' || true)
          echo "tag=$GITHUB_REF_NAME versionCode=$current previous=$previous_tag:$previous"
          if [ -z "$current" ] || [ -z "$previous" ]; then
            echo "::error::Could not read a versionCode from this build or from $previous_tag."
            exit 1
          fi
          if [ "$current" -le "$previous" ]; then
            echo "::error::versionCode $current must be greater than $previous (from $previous_tag)."
            echo "Android orders releases by versionCode alone, so an unchanged value ships an"
            echo "artifact the OS cannot tell apart from the release it is replacing."
            exit 1
          fi

      # The fastlane changelog doubles as the release body; without one, fall back to generated notes.
      - name: Resolve release notes
        id: notes
        run: |
          set -euo pipefail
          version_code=$(grep -om1 -P 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          notes="fastlane/metadata/android/en-US/changelogs/${version_code}.txt"
          if [ -s "$notes" ]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
            echo "Using $notes"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No $notes; GitHub will generate the release notes instead."
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          name: Papyrus ${{ github.ref_name }}
          prerelease: false
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          files: |
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            app/build/outputs/apk/release/app-universal-release.apk
          fail_on_unmatched_files: true
