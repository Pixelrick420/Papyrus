name: build

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Test and build
    # Branch pushes run this alongside the emulator suite; tag pushes get the release job instead.
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Resolve pinned NDK version
        id: ndk
        run: echo "version=$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)" >> "$GITHUB_OUTPUT"

      - name: Cache NDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ steps.ndk.outputs.version }}
          key: ndk-${{ runner.os }}-${{ steps.ndk.outputs.version }}

      - name: Install SDK packages
        run: |
          # android-37 lives in Google's newer repo index, which `android sdk install`
          # can't read; the runner image already ships it, so "not found" here is harmless.
          android sdk install platform-tools platforms/android-37 build-tools/36.0.0
          android sdk install "ndk/${{ steps.ndk.outputs.version }}"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble release
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: papyrus-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  instrumentation-tests:
    # Job id stays `instrumentation-tests` on purpose: gradle/actions/setup-gradle includes it in
    # its cache key, so renaming the id would orphan the Gradle cache already on the remote.
    name: Emulator tests
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The build fails only when MORE than this share of the emulator suite did not pass.
      EMULATOR_MAX_FAILURE_PERCENT: '80'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Resolve pinned NDK version
        id: ndk
        run: echo "version=$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)" >> "$GITHUB_OUTPUT"

      - name: Cache NDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ steps.ndk.outputs.version }}
          key: ndk-${{ runner.os }}-${{ steps.ndk.outputs.version }}

      - name: Align preinstalled command-line tools
        # The runner image's `cmdline-tools/latest` predates SDK XML v4, and
        # reactivecircus/android-emulator-runner reuses that directory whenever it exists
        # (it only downloads its own copy when it doesn't). setup-android has just installed
        # a current copy and put it first on PATH, so point `latest` at that one; otherwise
        # the emulator runner's sdkmanager warns about the v4 package.xml files the rest of
        # this job writes ("unexpected element ... abis" / "... translatedAbis").
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/cmdline-tools"
          active="$(dirname "$(dirname "$(command -v sdkmanager)")")"
          if [ "$active" != "$tools/latest" ]; then
            rm -rf "$tools/latest"
            ln -s "$active" "$tools/latest"
          fi

      - name: Install SDK packages
        run: |
          android sdk install platform-tools platforms/android-37 build-tools/36.0.0
          android sdk install "ndk/${{ steps.ndk.outputs.version }}"
          android sdk install "system-images;android-34;google_apis;x86_64"
          android sdk install emulator

      - name: Enable KVM
        # The runner exposes /dev/kvm but not the group permissions, so without this the emulator
        # silently falls back to software emulation and the job takes several times longer.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Instrumented tests only run against `debug`. They cannot run against the minified release build:
          # minification makes AGP minify the androidTest APK too, and hand it the app's output as a provided
          # classpath, so whatever R8 stripped from the app is missing at run time and the runner dies before
          # the first test -- reported as a green build with zero tests. See android/android-test#2167.
          #
          # The script runs `connectedDebugAndroidTest` but does not let failing tests fail this step; the
          # next step grades the whole suite instead.
          script: bash .github/scripts/run-emulator-tests.sh

      # A soft gate. The emulator suite is timing-sensitive on a software-rendered CI emulator, so a few
      # failing tests are reported (annotations + job summary) without failing the build. The job fails when
      # more than EMULATOR_MAX_FAILURE_PERCENT of the suite did not pass, and also when no tests reported at
      # all or when the run died partway: tests that never ran count as not passing, so a crash cannot hide
      # behind the tests that happened to finish first. `!cancelled()` so it still grades after a failed step.
      - name: Check emulator test results
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/evaluate-emulator-tests.py --max-failure-percent "$EMULATOR_MAX_FAILURE_PERCENT"

      - name: Upload emulator test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-test-results
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/emulator-ci/
          if-no-files-found: ignore

  release:
    name: Publish release
    # Tag pushes run only this job: the branch-only test and emulator jobs above are skipped.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 is load-bearing: the versionCode assert compares against the previous release
      # tag, the ancestry gate below needs origin/main, and a shallow fetch returns neither the tags
      # nor the previous file contents. `ci` needs no history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Placed before the build so an unreleasable tag fails in seconds instead of after a full assemble.
      # HEAD rather than GITHUB_SHA: for an annotated tag the latter is the tag object, which no branch
      # contains, so the ancestry check would fail for every annotated tag.
      - name: Assert the tag is on main
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main; refusing to publish it."
            echo "A commit that never reached main has run neither the unit tests nor the emulator suite."
            echo "Merge it to main first, then move the tag onto the merged commit."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on main at $(git rev-parse --short HEAD)"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Resolve pinned NDK version
        id: ndk
        run: echo "version=$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)" >> "$GITHUB_OUTPUT"

      - name: Cache NDK
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ steps.ndk.outputs.version }}
          key: ndk-${{ runner.os }}-${{ steps.ndk.outputs.version }}

      - name: Install SDK packages
        run: |
          # android-37 lives in Google's newer repo index, which `android sdk install`
          # can't read; the runner image already ships it, so "not found" here is harmless.
          android sdk install platform-tools platforms/android-37 build-tools/36.0.0
          android sdk install "ndk/${{ steps.ndk.outputs.version }}"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # The release key lives in repository secrets, never the repo -- a committed keystore is a
      # compromised key. Secrets are string-only, so the keystore travels base64-encoded in PAPYRUS_KEYSTORE_BASE64.
      - name: Check signing secrets are present
        env:
          KEYSTORE_B64: ${{ secrets.PAPYRUS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PAPYRUS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PAPYRUS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PAPYRUS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${KEYSTORE_B64:-}" ]   || missing+=(PAPYRUS_KEYSTORE_BASE64)
          [ -n "${STORE_PASSWORD:-}" ] || missing+=(PAPYRUS_STORE_PASSWORD)
          [ -n "${KEY_ALIAS:-}" ]      || missing+=(PAPYRUS_KEY_ALIAS)
          [ -n "${KEY_PASSWORD:-}" ]   || missing+=(PAPYRUS_KEY_PASSWORD)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing repository secret(s): ${missing[*]}"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "Without these the release cannot be signed, so this stops here rather"
            echo "than publishing an APK no one can upgrade to."
            exit 1
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.PAPYRUS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/papyrus-release.jks"
          test -s "$RUNNER_TEMP/papyrus-release.jks"

      - name: Assemble signed release
        env:
          PAPYRUS_STORE_FILE: ${{ runner.temp }}/papyrus-release.jks
          PAPYRUS_STORE_PASSWORD: ${{ secrets.PAPYRUS_STORE_PASSWORD }}
          PAPYRUS_KEY_ALIAS: ${{ secrets.PAPYRUS_KEY_ALIAS }}
          PAPYRUS_KEY_PASSWORD: ${{ secrets.PAPYRUS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signatures
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          count=0
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "::group::$apk"
            # Fails on an unsigned APK, catching a build that silently lost its signing config.
            "$build_tools/apksigner" verify --print-certs --verbose "$apk"
            echo "::endgroup::"
            # A signed APK is not automatically release-signed: the debug key satisfies apksigner
            # but makes an artifact no properly signed build can replace.
            if "$build_tools/apksigner" verify --print-certs "$apk" \
              | grep -q 'CN=Android Debug'; then
              echo "::error::$apk is signed with the Android debug certificate"
              exit 1
            fi
            count=$((count + 1))
          done
          echo "Verified $count signed APK(s)"
          test "$count" -eq 1

      - name: Assert the tag matches versionName
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          actual=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "tag=$tag versionName=$actual"
          if [ "$tag" != "$actual" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $actual in app/build.gradle.kts"
            exit 1
          fi

      # Catches a missed versionCode bump, which the versionName assert cannot: versionCode is the
      # only value the package manager orders releases by, so a repeat ships an artifact the OS cannot tell apart. Compared against the previous release tag.
      - name: Assert versionCode increased
        run: |
          set -euo pipefail
          current=$(grep -om1 -P 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          # A read loop, not `git tag | grep | head -1`: a head-terminated pipeline can SIGPIPE its
          # writer, which `pipefail` reports as exit 141. Not reachable today (~20k tags needed), kept off the release gate.
          previous_tag=""
          while read -r candidate; do
            if [ "$candidate" != "$GITHUB_REF_NAME" ]; then
              previous_tag="$candidate"
              break
            fi
          done < <(git tag --list 'v*' --sort=-v:refname)
          if [ -z "$previous_tag" ]; then
            echo "No earlier v* tag to compare against; skipping the versionCode check."
            exit 0
          fi
          previous=$(git show "$previous_tag:app/build.gradle.kts" \
            | grep -om1 -P 'versionCode\s*=\s*\K\d+' || true)
          echo "tag=$GITHUB_REF_NAME versionCode=$current previous=$previous_tag:$previous"
          if [ -z "$current" ] || [ -z "$previous" ]; then
            echo "::error::Could not read a versionCode from this build or from $previous_tag."
            exit 1
          fi
          if [ "$current" -le "$previous" ]; then
            echo "::error::versionCode $current must be greater than $previous (from $previous_tag)."
            echo "Android orders releases by versionCode alone, so an unchanged value ships an"
            echo "artifact the OS cannot tell apart from the release it is replacing."
            exit 1
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          name: Papyrus ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
