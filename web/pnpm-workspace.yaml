# pnpm 11+ reads project settings from here, not from the "pnpm" field in package.json.
allowBuilds:
  esbuild: true
  sharp: true

# pnpm 12's 24h minimumReleaseAge failed every install on tslib@2.9.1 (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION).
# Drop this exemption once 2.9.1 is no longer a fresh release.
minimumReleaseAgeExclude:
  - tslib@2.9.1

# 11 keeps the glob API eslint and typescript-eslint need, so the tree uses one copy of minimatch.
overrides:
  minimatch: ^11.0.1
  # deepmerge >= 4.2.0 has a prototype poisoning bug with no fixed release; 4.1.2 predates it.
  deepmerge: 4.1.2
