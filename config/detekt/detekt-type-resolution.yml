# Only rules that need Kotlin type resolution. The plain `detekt` task cannot run these; `check` also runs detektDebug.
# "unused" rules are omitted: detektDebug cannot resolve AGP's generated BuildConfig and reports false positives.

config:
  validation: true
  warningsAsErrors: false

style:
  active: false

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
  CastToNullableType:
    active: true
  UnreachableCode:
    active: true

exceptions:
  active: false

coroutines:
  active: true
  SuspendFunSwallowedCancellation:
    active: true

complexity:
  active: false

naming:
  active: false

performance:
  active: false

empty-blocks:
  active: false

comments:
  active: false
