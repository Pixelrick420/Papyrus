# `buildUponDefaultConfig = false` in app/build.gradle.kts: a rule that is not listed here does not run.
# Scope is dead code and correctness; documentation and formatting rules are off on purpose (see the bottom).
# No `detekt-formatting`: UnusedImport also ships in core under `style`, and the ruleset would pull in ~200 unrelated rules.

config:
  validation: true
  warningsAsErrors: false

style:
  # detekt skips `override` members, so framework callbacks and @Composable entry points are not flagged.
  # detekt 2.x split `UnusedPrivateMember` into these rules; all are listed to keep the 1.x coverage.
  UnusedPrivateFunction:
    active: true
    allowedNames: '_|ignored|expected|serialVersionUID'
  UnusedVariable:
    active: true
    allowedNames: '_|ignored|expected|serialVersionUID'
  UnusedPrivateProperty:
    active: true
    allowedNames: '_|ignored|expected|serialVersionUID'
  UnusedPrivateClass:
    active: true
  # kotlinc does not warn on unused imports at all.
  UnusedImport:
    active: true
  # @Composable is ignored: `by remember { }` state and Compose lambdas pass parameters only the compiler plugin consumes.
  UnusedParameter:
    active: true
    allowedNames: 'ignored|expected|_'

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
  CastToNullableType:
    active: true
  UnreachableCode:
    active: true

exceptions:
  active: true
  # Deliberate catches carry a local @Suppress; a baseline entry would also cover new catches with the same signature.
  TooGenericExceptionCaught:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected).*'
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - 'InterruptedException'
      - 'MalformedURLException'
      - 'NumberFormatException'
      - 'ParseException'

complexity:
  # Measured on this codebase: defaults report 217 findings (7 LargeClass, 46 LongMethod,
  # 164 TooManyFunctions). OfficeTextExtractor.kt is ~730 lines by design, and the large screens
  # are the target of a separate decomposition, so a gate here would be noise until that lands.
  active: false

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true
  SuspendFunWithFlowReturnType:
    active: true
  # SuspendFunSwallowedCancellation needs type resolution; it runs under detektDebug only.

naming:
  active: false

performance:
  active: false

empty-blocks:
  active: false

comments:
  active: false
  # These ask for more documentation; the codebase documents only the why. OutdatedDocumentation only matters when KDoc is enforced.
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false
  OutdatedDocumentation:
    active: false